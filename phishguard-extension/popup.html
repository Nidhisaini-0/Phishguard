<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; width: 330px; background: #0f172a; color: #e2e8f0;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 1.1rem; }
  h1 span { color: #22c55e; }
  .top { display: flex; align-items: center; gap: 12px; }
  .dot { width: 38px; height: 38px; border-radius: 50%; flex: none; }
  .verdict { font-size: 1.15rem; font-weight: 700; }
  .url { font-size: .75rem; color: #94a3b8; word-break: break-all; margin-top: 2px; }
  .meter { margin: 14px 0 4px; height: 10px; background: #334155; border-radius: 6px; overflow: hidden; }
  .bar { height: 100%; width: 0; transition: width .6s ease; }
  .score { font-size: .78rem; color: #94a3b8; }
  ul { list-style: none; margin: 12px 0 0; padding: 0; }
  li { background: #0b1220; border-left: 4px solid #334155; border-radius: 6px;
       padding: 8px 10px; margin-bottom: 6px; font-size: .82rem; }
  .msg { color: #94a3b8; font-size: .9rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>Phish<span>Guard</span></h1>
    <div id="out" class="msg">Checking this page...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
